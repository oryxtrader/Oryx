<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Oryx Deriv Analysis Tool</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    header p {
      color: #94a3b8;
    }

    .input-card {
      background: #1e293b;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 16px;
      resize: vertical;
    }

    button {
      margin-top: 15px;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: #062b16;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .results {
      display: none;
    }

    .summary {
      background: #1e293b;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .summary h2 {
      margin-bottom: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 15px;
      border: 1px solid #334155;
    }

    .card h3 {
      color: #94a3b8;
      margin-bottom: 15px;
      font-size: 17px;
    }

    .value {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .percentage {
      color: #22c55e;
      font-size: 16px;
    }

    .section-title {
      margin: 30px 0 15px;
      font-size: 24px;
    }

    .frequency-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .frequency-item {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid #334155;
    }
